[workspace]
members = [
    "crates/anvil-edit-contracts",
    "crates/anvil-edit-core",
    "crates/anvil-editd",
    "xtask",
]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97.1"
publish = false

[workspace.dependencies]
anvil-edit-contracts = { path = "crates/anvil-edit-contracts" }
anvil-edit-core = { path = "crates/anvil-edit-core" }
arc-swap = "1.9.2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
